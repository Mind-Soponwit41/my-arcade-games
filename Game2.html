<html lang="th">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome 6.5.2 (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Tailwind CSS (CDN) -->

    <!-- JS Libraries (CDN) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Sarabun', 'Chakra Petch', sans-serif;
            background: radial-gradient(circle at 50% 0%, #e0f2fe 0%, #f8fafc 50%, #f1f5f9 100%);
            color: #0f172a;
            user-select: none;
        }

        .heading-font { font-family: 'Chakra Petch', sans-serif; }

        .cyber-panel {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(14px);
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.05);
        }

        /* ตารางซูโดกุสี่เหลี่ยมจัตุรัสสมบูรณ์ */
        #sudokuBoard {
            display: grid;
            box-sizing: border-box;
            background-color: #0f172a;
            border: 3px solid #0f172a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.2);
        }

        .sudoku-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            cursor: pointer;
            box-sizing: border-box;
            transition: background-color 0.12s ease;
        }
        .sudoku-cell.selected {
            background-color: #bae6fd !important;
            color: #0284c7 !important;
            box-shadow: inset 0 0 0 3px #0284c7;
            z-index: 5;
        }
        .sudoku-cell.highlighted {
            background-color: #f0f9ff;
        }
        .sudoku-cell.same-number {
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: 800;
        }
        .sudoku-cell.scan-error {
            background-color: #fecdd3 !important;
            color: #e11d48 !important;
            animation: pulse-red 1.2s infinite;
        }
        .sudoku-cell.error {
            background-color: #ffe4e6 !important;
            color: #e11d48 !important;
            animation: shake 0.3s;
        }

        @keyframes pulse-red {
            0%, 100% { background-color: #fecdd3; }
            50% { background-color: #fda4af; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .swal2-popup {
            font-family: 'Chakra Petch', 'Sarabun', sans-serif !important;
            border-radius: 1.5rem !important;
            background: #ffffff !important;
            border: 2px solid #0284c7 !important;
            box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.2) !important;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col p-2 sm:p-2.5">

                <i class="fa-solid fa-microchip"></i>

    <!-- 3. พื้นที่เล่นเกมหลัก -->

                    <i class="fa-solid fa-arrows-rotate"></i>

    <script>
        // --- 1. Web Audio API Engine ---
        const AudioFX = {
            ctx: null,
            enabled: true,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            toggleMute() {
                this.enabled = !this.enabled;
                const icon = document.getElementById('soundIcon');
                if (this.enabled) {
                    icon.className = 'fa-solid fa-volume-high text-xs';
                    this.playClick();
                } else {
                    icon.className = 'fa-solid fa-volume-xmark text-xs text-rose-500';
                }
            },
            playBeep(freq, type, duration) {
                if (!this.enabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type || 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            },
            playClick() { this.playBeep(900, 'sine', 0.04); },
            playInput() { this.playBeep(650, 'triangle', 0.08); },
            playErase() { this.playBeep(350, 'sine', 0.08); },
            playError() { this.playBeep(220, 'sawtooth', 0.25); },
            playShield() { this.playBeep(440, 'sine', 0.15); setTimeout(() => this.playBeep(880, 'sine', 0.2), 100); },
            playReveal() { this.playBeep(587.33, 'triangle', 0.1); setTimeout(() => this.playBeep(880, 'triangle', 0.2), 100); },
            playWin() {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
                    setTimeout(() => this.playBeep(f, 'sine', 0.25), idx * 100);
                });
            }
        };

        function toggleFullScreen() {
            AudioFX.playClick();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // --- 2. ตัวแปรระบบ ---
        let selectedSize = 4;        // 4, 6, 9
        let selectedPercent = 60;    // 60, 40, 25, 15

        let N = 4, boxR = 2, boxC = 2;
        let solutionBoard = [];
        let puzzleBoard = [];
        let userBoard = [];
        let selectedCell = null;
        let traceCount = 0;
        let maxErrors = 3;
        let timerSeconds = 0;
        let timerInterval = null;
        let moveHistory = [];

        // สกิลเสริม
        let shieldActive = false;
        let shieldCharges = 1;
        let revealCharges = 2;

        function setSize(size) {
            AudioFX.playClick();
            selectedSize = size;
            updateSelectorStyles();
            startNewGame();
        }

        function setPercent(pct) {
            AudioFX.playClick();
            selectedPercent = pct;
            updateSelectorStyles();
            startNewGame();
        }

        function updateSelectorStyles() {
            $('.size-btn').removeClass('bg-sky-600 text-white border-sky-600').addClass('bg-slate-100 text-slate-700 border-slate-200');
            $(`#btnSize${selectedSize}`).removeClass('bg-slate-100 text-slate-700 border-slate-200').addClass('bg-sky-600 text-white border-sky-600');

            $('.pct-btn').removeClass('bg-indigo-600 text-white border-indigo-600').addClass('bg-slate-100 text-slate-700 border-slate-200');
            $(`#btnPct${selectedPercent}`).removeClass('bg-slate-100 text-slate-700 border-slate-200').addClass('bg-indigo-600 text-white border-indigo-600');
        }

        // --- 3. Instant Matrix Isomorphism Engine (แก้ปัญหาค้าง 100% เร็ว 0.5ms) ---
        function generateInstantSudoku(n, br, bc, targetClues) {
            // 1. สร้าง Base Sudoku ที่ถูกต้องตามคณิตศาสตร์ 100%
            let base = Array.from({ length: n }, () => Array(n).fill(0));
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    if (n === 9) {
                        base[r][c] = (r * 3 + Math.floor(r / 3) + c) % 9 + 1;
                    } else if (n === 6) {
                        base[r][c] = (r * 3 + Math.floor(r / 2) + c) % 6 + 1;
                    } else { // 4x4
                        base[r][c] = (r * 2 + Math.floor(r / 2) + c) % 4 + 1;
                    }
                }
            }

            // 2. สุ่มจับคู่ตัวเลขใหม่ทั้งหมด (Symbol Relabeling)
            let mapping = Array.from({ length: n }, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    base[r][c] = mapping[base[r][c] - 1];
                }
            }

            // 3. สุ่มสลับแถวภายในกลุ่มบล็อกเดียวกัน (Row permutations within bands)
            for (let b = 0; b < n; b += br) {
                let rows = Array.from({ length: br }, (_, i) => b + i).sort(() => Math.random() - 0.5);
                let copy = base.map(row => [...row]);
                for (let i = 0; i < br; i++) {
                    base[b + i] = copy[rows[i]];
                }
            }

            // 4. สุ่มสลับคอลัมน์ภายในกลุ่มบล็อกเดียวกัน (Column permutations within stacks)
            for (let b = 0; b < n; b += bc) {
                let cols = Array.from({ length: bc }, (_, i) => b + i).sort(() => Math.random() - 0.5);
                let copy = base.map(row => [...row]);
                for (let r = 0; r < n; r++) {
                    for (let i = 0; i < bc; i++) {
                        base[r][b + i] = copy[r][cols[i]];
                    }
                }
            }

            const solution = base.map(row => [...row]);
            const puzzle = base.map(row => [...row]);

            // 5. สุ่มนำตัวเลขออกตามจำนวน % อย่างรวดเร็วโดยไม่ค้าง
            const totalCells = n * n;
            const removeCount = totalCells - targetClues;

            let coords = [];
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) coords.push([r, c]);
            }
            coords.sort(() => Math.random() - 0.5);

            for (let i = 0; i < removeCount; i++) {
                const [r, c] = coords[i];
                puzzle[r][c] = 0;
            }

            return { solution, puzzle, actualClues: targetClues };
        }

        // --- 4. ฟังก์ชันปรับขนาดกระดานให้เต็มความจุสูงสุดและเป็นสี่เหลี่ยมจัตุรัส ---
        function fitSudokuBoard() {
            const container = document.getElementById('gridContainer');
            const board = document.getElementById('sudokuBoard');
            if (!container || !board) return;

            const padding = 16;
            const availW = container.clientWidth - padding;
            const availH = container.clientHeight - padding;
            const optimalSize = Math.floor(Math.min(availW, availH));

            if (optimalSize > 50) {
                board.style.width = `${optimalSize}px`;
                board.style.height = `${optimalSize}px`;
                board.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
                board.style.gridTemplateRows = `repeat(${N}, 1fr)`;

                const cellSize = optimalSize / N;
                const fontSize = Math.floor(cellSize * 0.52);
                $('.sudoku-cell').css('font-size', `${fontSize}px`);
            }
        }

        window.addEventListener('resize', fitSudokuBoard);

        // --- 5. เริ่มต้นสร้างรอบเกมใหม่ ---
        function startNewGame() {
            N = selectedSize;
            if (N === 4) { boxR = 2; boxC = 2; }
            else if (N === 6) { boxR = 2; boxC = 3; }
            else { boxR = 3; boxC = 3; }

            const totalCells = N * N;
            let targetClues = Math.round(totalCells * (selectedPercent / 100));

            traceCount = 0;
            moveHistory = [];
            selectedCell = null;
            shieldActive = false;
            shieldCharges = 1;
            revealCharges = 2;
            updateShieldDisplay();
            updateRevealDisplay();
            updateTraceDisplay();

            const { solution, puzzle, actualClues } = generateInstantSudoku(N, boxR, boxC, targetClues);
            solutionBoard = solution;
            puzzleBoard = puzzle.map(r => [...r]);
            userBoard = puzzle.map(r => [...r]);

            const actualPercent = Math.round((actualClues / totalCells) * 100);
            document.getElementById('currentSummaryTitle').innerText = `กระดาน ${N}×${N} • เปิดเผย ${selectedPercent}%`;
            document.getElementById('currentSummarySub').innerText = `แสดงตัวอย่าง ${actualClues} จาก ${totalCells} ช่อง (${actualPercent}%)`;
            document.getElementById('cluePercentBadge').innerText = `${selectedPercent}% CLUES`;
            document.getElementById('maxNumIndicator').innerText = N;

            renderGrid();
            renderNumpad();
            updateRemainingCount();
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = 0;
            document.getElementById('gameTimer').innerText = '00:00';
            timerInterval = setInterval(() => {
                timerSeconds++;
                const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                const secs = String(timerSeconds % 60).padStart(2, '0');
                document.getElementById('gameTimer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function renderGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            const table = document.createElement('div');
            table.id = 'sudokuBoard';

            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    const cell = document.createElement('div');
                    cell.id = `cell-${r}-${c}`;
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.className = 'sudoku-cell font-bold text-slate-800';

                    let borderStyles = 'border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;';
                    if ((c + 1) % boxC === 0 && c + 1 !== N) {
                        borderStyles += ' border-right: 3px solid #0f172a;';
                    }
                    if ((r + 1) % boxR === 0 && r + 1 !== N) {
                        borderStyles += ' border-bottom: 3px solid #0f172a;';
                    }
                    cell.style.cssText = borderStyles;

                    const isGiven = puzzleBoard[r][c] !== 0;
                    if (isGiven) {
                        cell.classList.add('bg-slate-100', 'text-slate-900', 'font-black');
                        cell.innerText = puzzleBoard[r][c];
                    }

                    cell.onclick = () => selectCell(r, c);
                    table.appendChild(cell);
                }
            }

            container.appendChild(table);
            fitSudokuBoard();
        }

        // เรนเดอร์แป้นพิมพ์ตัวเลข พร้อมแผงนับจำนวนตัวเลขที่เหลือ (Number Tracker)
        function renderNumpad() {
            const container = document.getElementById('numpadContainer');
            container.innerHTML = '';
            
            const cols = N === 4 ? 'grid-cols-4' : (N === 6 ? 'grid-cols-6' : 'grid-cols-3 sm:grid-cols-9');
            container.className = `grid ${cols} gap-1.5 w-full`;

            for (let i = 1; i <= N; i++) {
                // คำนวณจำนวนที่เหลือของเลขนี้
                let placed = 0;
                for (let r = 0; r < N; r++) {
                    for (let c = 0; c < N; c++) {
                        if (userBoard[r][c] === i) placed++;
                    }
                }
                const left = N - placed;
                const isComplete = left <= 0;

                const btn = document.createElement('button');
                btn.id = `numBtn-${i}`;
                btn.className = `py-2 rounded-xl border shadow-xs transition active:scale-95 flex flex-col items-center justify-center ${
                    isComplete 
                    ? 'bg-emerald-50 text-emerald-700 border-emerald-300 opacity-80' 
                    : 'bg-white hover:bg-sky-50 text-slate-800 border-slate-300'
                }`;
                btn.innerHTML = `
                    <span class="font-black text-sm sm:text-base leading-none">${i}</span>
                    <span class="text-[9px] mt-0.5 font-bold ${isComplete ? 'text-emerald-600' : 'text-slate-400'}">${isComplete ? 'ครบ ✓' : `เหลือ ${left}`}</span>
                `;
                btn.onclick = () => inputNumber(i);
                container.appendChild(btn);
            }
        }

        // --- 6. การเลือกช่องและการเน้นสี ---
        function selectCell(r, c) {
            AudioFX.playClick();
            selectedCell = { r, c };

            $('.sudoku-cell').removeClass('selected highlighted same-number scan-error');

            const val = userBoard[r][c];
            const startR = Math.floor(r / boxR) * boxR;
            const startC = Math.floor(c / boxC) * boxC;

            for (let i = 0; i < N; i++) {
                for (let j = 0; j < N; j++) {
                    const isSameRow = i === r;
                    const isSameCol = j === c;
                    const isSameBox = (i >= startR && i < startR + boxR) && (j >= startC && j < startC + boxC);

                    if (isSameRow || isSameCol || isSameBox) {
                        $(`#cell-${i}-${j}`).addClass('highlighted');
                    }
                    if (val !== 0 && userBoard[i][j] === val) {
                        $(`#cell-${i}-${j}`).addClass('same-number');
                    }
                }
            }

            $(`#cell-${r}-${c}`).addClass('selected');
        }

        // --- 7. การป้อนข้อมูล ---
        function inputNumber(num) {
            if (!selectedCell) return;
            const { r, c } = selectedCell;

            if (puzzleBoard[r][c] !== 0) return; // ช่องโจทย์ล็อค

            if (userBoard[r][c] === num) return;

            if (num === solutionBoard[r][c]) {
                // ใส่ถูกต้อง
                AudioFX.playInput();
                moveHistory.push({ r, c, prevVal: userBoard[r][c] });
                userBoard[r][c] = num;
                document.getElementById(`cell-${r}-${c}`).innerText = num;
                selectCell(r, c);
                updateRemainingCount();
                renderNumpad();
                checkVictory();
            } else {
                // ใส่ผิด
                if (shieldActive) {
                    // โล่ป้องกันดูดซับความผิดพลาด
                    shieldActive = false;
                    updateShieldDisplay();
                    AudioFX.playShield();
                    Swal.fire({
                        title: '🛡️ เกราะป้องกันทำงาน!',
                        text: 'ระบบดูดซับความผิดพลาดให้ 1 ครั้งโดยไม่เพิ่มระดับการตรวจจับ',
                        icon: 'info',
                        timer: 1200,
                        showConfirmButton: false
                    });
                } else {
                    AudioFX.playError();
                    traceCount++;
                    updateTraceDisplay();
                    const $cell = $(`#cell-${r}-${c}`);
                    $cell.addClass('error');
                    setTimeout(() => $cell.removeClass('error'), 400);

                    if (traceCount >= maxErrors) {
                        triggerGameOver();
                    }
                }
            }
        }

        function eraseCurrentCell() {
            if (!selectedCell) return;
            const { r, c } = selectedCell;
            if (puzzleBoard[r][c] !== 0) return;

            AudioFX.playErase();
            moveHistory.push({ r, c, prevVal: userBoard[r][c] });
            userBoard[r][c] = 0;
            document.getElementById(`cell-${r}-${c}`).innerText = '';
            selectCell(r, c);
            updateRemainingCount();
            renderNumpad();
        }

        function undoMove() {
            if (moveHistory.length === 0) return;
            AudioFX.playClick();
            const last = moveHistory.pop();
            userBoard[last.r][last.c] = last.prevVal;
            document.getElementById(`cell-${last.r}-${last.c}`).innerText = last.prevVal === 0 ? '' : last.prevVal;
            selectCell(last.r, last.c);
            updateRemainingCount();
            renderNumpad();
        }

        // --- 8. ระบบใหม่: สกิลไซเบอร์ช่วยเหลือ ---
        // สกิล 1: กางโล่ป้องกัน (Firewall Shield)
        function activateShield() {
            if (shieldCharges <= 0) {
                Swal.fire('พลังงานหมด', 'ใช้โควตากางโล่ครบแล้วสำหรับรอบนี้', 'warning');
                return;
            }
            if (shieldActive) return;

            AudioFX.playShield();
            shieldActive = true;
            shieldCharges--;
            updateShieldDisplay();

            Swal.fire({
                title: '🛡️ กางโล่สำเร็จ!',
                text: 'หากใส่เลขผิดครั้งถัดไป จะไม่เสียระดับการตรวจจับ (Trace)',
                icon: 'success',
                timer: 1100,
                showConfirmButton: false
            });
        }

        function updateShieldDisplay() {
            const ind = document.getElementById('shieldIndicator');
            const icon = document.getElementById('shieldIcon');
            const text = document.getElementById('shieldText');
            const btnText = document.getElementById('shieldBtnText');

            if (shieldActive) {
                ind.className = 'bg-emerald-50 border border-emerald-300 px-2.5 py-1 rounded-xl flex items-center gap-1.5 text-xs font-bold text-emerald-800 animate-pulse';
                icon.className = 'fa-solid fa-shield-halved text-emerald-600';
                text.innerText = 'โล่: พร้อมทำงาน';
            } else {
                ind.className = 'bg-slate-100 border border-slate-200 px-2.5 py-1 rounded-xl flex items-center gap-1.5 text-xs font-bold text-slate-400';
                icon.className = 'fa-solid fa-shield-halved text-slate-400';
                text.innerText = 'โล่: ปิด';
            }
            btnText.innerText = `กางโล่ (${shieldCharges})`;
        }

        // สกิล 2: แฮกเฉลยช่องทันที (Quantum Reveal)
        function triggerQuantumReveal() {
            if (!selectedCell) {
                Swal.fire('เลือกช่องก่อน', 'กรุณาคลิกเลือกช่องว่างที่ต้องการแฮกถอดรหัสครับ', 'info');
                return;
            }
            const { r, c } = selectedCell;
            if (puzzleBoard[r][c] !== 0 || userBoard[r][c] === solutionBoard[r][c]) {
                Swal.fire('ช่องนี้เรียบร้อยแล้ว', 'เลือกช่องว่างอื่นที่ยังไม่ได้แก้รหัสนะครับ', 'info');
                return;
            }
            if (revealCharges <= 0) {
                Swal.fire('โควตาหมด', 'ใช้สิทธิ์แฮกถอดรหัสครบ 2 ครั้งแล้วสำหรับรอบนี้', 'warning');
                return;
            }

            AudioFX.playReveal();
            revealCharges--;
            updateRevealDisplay();

            const correctVal = solutionBoard[r][c];
            userBoard[r][c] = correctVal;
            document.getElementById(`cell-${r}-${c}`).innerText = correctVal;
            selectCell(r, c);
            updateRemainingCount();
            renderNumpad();
            checkVictory();
        }

        function updateRevealDisplay() {
            document.getElementById('revealBtnText').innerText = `แฮก (${revealCharges})`;
        }

        // สกิล 3: เรดาร์สแกนจุดผิดทั่วกระดาน (Cyber Radar Scanner)
        function scanForErrors() {
            AudioFX.playClick();
            let errorCount = 0;

            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    if (userBoard[r][c] !== 0 && userBoard[r][c] !== solutionBoard[r][c]) {
                        $(`#cell-${r}-${c}`).addClass('scan-error');
                        errorCount++;
                    }
                }
            }

            if (errorCount > 0) {
                AudioFX.playError();
                Swal.fire({
                    title: '⚠️ ตรวจพบจุดผิด!',
                    text: `เรดาร์ตรวจพบตัวเลขที่ใส่ผิดจำนวน ${errorCount} ช่อง (ไฮไลต์สีชมพูกะพริบ)`,
                    icon: 'warning',
                    confirmButtonText: 'รับทราบ',
                    confirmButtonColor: '#e11d48'
                });
            } else {
                AudioFX.playWin();
                Swal.fire({
                    title: '✅ ระบบปลอดภัย 100%',
                    text: 'ตัวเลขทุกช่องที่คุณใส่ถูกต้องทั้งหมด ไม่มีข้อผิดพลาดครับ!',
                    icon: 'success',
                    timer: 1200,
                    showConfirmButton: false
                });
            }
        }

        function updateTraceDisplay() {
            document.getElementById('traceText').innerText = `ตรวจจับ: ${traceCount}/${maxErrors}`;
        }

        function updateRemainingCount() {
            let empty = 0;
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    if (userBoard[r][c] === 0) empty++;
                }
            }
            document.getElementById('cellsRemainingText').innerText = `เหลือ ${empty} ช่อง`;
        }

        // --- 9. คีย์บอร์ดควบคุม ---
        $(document).on('keydown', function(e) {
            if (!selectedCell) return;
            let { r, c } = selectedCell;

            if (e.key === 'ArrowUp') { r = (r - 1 + N) % N; selectCell(r, c); e.preventDefault(); }
            else if (e.key === 'ArrowDown') { r = (r + 1) % N; selectCell(r, c); e.preventDefault(); }
            else if (e.key === 'ArrowLeft') { c = (c - 1 + N) % N; selectCell(r, c); e.preventDefault(); }
            else if (e.key === 'ArrowRight') { c = (c + 1) % N; selectCell(r, c); e.preventDefault(); }
            else if (e.key >= '1' && e.key <= String(N)) { inputNumber(parseInt(e.key, 10)); }
            else if (e.key === 'Backspace' || e.key === 'Delete') { eraseCurrentCell(); }
        });

        // --- 10. ชนะเกม & จบเกม ---
        function checkVictory() {
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    if (userBoard[r][c] !== solutionBoard[r][c]) return;
                }
            }

            clearInterval(timerInterval);
            AudioFX.playWin();

            try {
                confetti({ particleCount: 160, spread: 80, origin: { y: 0.6 } });
            } catch(e){}

            const timeStr = document.getElementById('gameTimer').innerText;

            Swal.fire({
                title: '🎉 ถอดรหัสสำเร็จ 100%!',
                html: `
                    <div class="space-y-2 text-xs text-slate-700">
                        <p class="text-sm font-bold text-sky-800">คุณแก้ปริศนาตรรกะได้สมบูรณ์แบบ!</p>
                        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1">
                            <div class="flex justify-between"><span>ขนาดกระดาน:</span><b>${N}×${N} (เปิดเผย ${selectedPercent}%)</b></div>
                            <div class="flex justify-between"><span>เวลาที่ใช้:</span><b class="text-sky-700">${timeStr} นาที</b></div>
                            <div class="flex justify-between"><span>ข้อผิดพลาด:</span><b>${traceCount}/${maxErrors} ครั้ง</b></div>
                        </div>
                    </div>
                `,
                icon: 'success',
                confirmButtonText: 'เล่นรอบใหม่ ⏩',
                confirmButtonColor: '#0284c7'
            }).then(() => {
                startNewGame();
            });
        }

        function triggerGameOver() {
            clearInterval(timerInterval);
            AudioFX.playError();
            Swal.fire({
                title: '🔒 ไฟร์วอลล์บล็อกระบบ!',
                text: `คุณใส่เลขผิดครบ ${maxErrors} ครั้ง ระบบตัดการเชื่อมต่อเพื่อความปลอดภัย`,
                icon: 'error',
                confirmButtonText: 'ลองใหม่อีกครั้ง',
                confirmButtonColor: '#e11d48'
            }).then(() => {
                startNewGame();
            });
        }

        function showRulesModal() {
            AudioFX.playClick();
            Swal.fire({
                title: '📖 กฎกติกา Sudoku Cyber Logic',
                html: `
                    <div class="text-xs text-left space-y-2 text-slate-700 leading-relaxed">
                        <p class="font-bold text-sky-800">กติกาพื้นฐานของ Sudoku:</p>
                        <div class="p-2 bg-sky-50 border border-sky-200 rounded-xl space-y-1">
                            <div>• <b>แถวแนวนอน:</b> ต้องมีตัวเลขครบ 1 ถึง ${N} โดยไม่ซ้ำ</div>
                            <div>• <b>คอลัมน์แนวตั้ง:</b> ต้องมีตัวเลขครบ 1 ถึง ${N} โดยไม่ซ้ำ</div>
                            <div>• <b>กล่องย่อย:</b> ต้องมีตัวเลขครบโดยไม่ซ้ำ</div>
                        </div>
                        <p class="font-bold text-slate-800">สกิลเสริมไซเบอร์:</p>
                        <ul class="list-disc pl-4 space-y-0.5 text-slate-600">
                            <li><b>🛡️ กางโล่:</b> ป้องกันข้อผิดพลาด 1 ครั้ง</li>
                            <li><b>⚡ แฮก:</b> ถอดรหัสเฉลยช่องที่เลือกทันที (2 ครั้ง)</li>
                            <li><b>📡 เรดาร์สแกน:</b> ตรวจหาช่องที่ใส่ผิดทั้งกระดาน</li>
                            <li><b>🔢 ตัวนับตัวเลข:</b> สังเกตตัวเลขที่ปุ่ม ถ้าครบแล้วจะขึ้นสีเขียว</li>
                        </ul>
                    </div>
                `,
                confirmButtonText: 'เข้าใจแล้ว',
                confirmButtonColor: '#0284c7'
            });
        }

        window.onload = function() {
            updateSelectorStyles();
            startNewGame();
        };
    </script>
</body>
