<!DOCTYPE html>
<html lang="th" class="h-full w-full overflow-hidden select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monster Diner: มินิเกมครัวป่วน ฝึก 5 ทักษะเมาส์</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Prompt & Itim (น่ารัก อ่านง่าย สำหรับเด็ก) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Prompt:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Prompt', 'Itim', sans-serif;
      touch-action: manipulation;
      -webkit-user-drag: none;
      user-select: none;
    }
    .font-kid {
      font-family: 'Itim', cursive, sans-serif;
    }

    /* Zero-Scroll Guarantee */
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0f172a;
    }

    /* Diner Kitchen Checkered Tile Floor */
    .diner-floor {
      background-color: #fed7aa;
      background-image: 
        linear-gradient(45deg, #fdba74 25%, transparent 25%),
        linear-gradient(-45deg, #fdba74 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #fdba74 75%),
        linear-gradient(-45deg, transparent 75%, #fdba74 75%);
      background-size: 40px 40px;
      background-position: 0 0, 0 20px, 20px -20px, -20px 0;
    }

    /* Giant Wooden Cutting Board */
    .cutting-board-giant {
      background: radial-gradient(circle at 50% 30%, #fef3c7 0%, #fde68a 45%, #f59e0b 90%, #d97706 100%);
      border: 10px solid #92400e;
      box-shadow: 0 20px 40px rgba(146, 64, 14, 0.45), inset 0 4px 15px rgba(255, 255, 255, 0.6);
    }

    /* Giant BBQ Grill Grate */
    .grill-grate-giant {
      background: repeating-linear-gradient(
        0deg,
        #1e293b,
        #1e293b 12px,
        #090d16 12px,
        #090d16 28px
      );
      box-shadow: inset 0 0 50px #dc2626, 0 20px 40px rgba(0,0,0,0.6);
      border: 10px solid #334155;
    }

    /* Animations */
    @keyframes pulseGlowGreen {
      0%, 100% { filter: drop-shadow(0 0 3px #22c55e); fill: #22c55e; }
      50% { filter: drop-shadow(0 0 12px #4ade80); fill: #4ade80; }
    }
    @keyframes pulseGlowOrange {
      0%, 100% { filter: drop-shadow(0 0 3px #f97316); fill: #f97316; }
      50% { filter: drop-shadow(0 0 12px #fb923c); fill: #fb923c; }
    }
    @keyframes rippleCircle {
      0% { r: 5; opacity: 1; }
      100% { r: 24; opacity: 0; }
    }
    .mouse-pulse-green { animation: pulseGlowGreen 1s infinite ease-in-out; }
    .mouse-pulse-orange { animation: pulseGlowOrange 1s infinite ease-in-out; }
    .ripple-active { animation: rippleCircle 0.8s infinite ease-out; }

    /* Knife Chop Animation */
    @keyframes knifeChopAnim {
      0% { transform: translate(60px, -60px) rotate(25deg); opacity: 0; }
      20% { opacity: 1; }
      50% { transform: translate(0px, 0px) rotate(-15deg); }
      75% { transform: translate(-10px, -20px) rotate(-5deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); opacity: 1; }
    }
    .knife-slashing { animation: knifeChopAnim 0.25s ease-out; }

    /* Smoke drift */
    @keyframes smokeFloat {
      0% { transform: translateY(0) scale(0.7); opacity: 0.8; }
      100% { transform: translateY(-70px) scale(1.6); opacity: 0; }
    }
    .smoke-anim { animation: smokeFloat 1.4s infinite ease-out; }

    /* Splash pop */
    @keyframes splatPop {
      0% { transform: scale(0.2); opacity: 0; }
      70% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .splat-pop { animation: splatPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    /* Target Ring Pulse */
    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.12); opacity: 1; }
    }
    .target-pulse { animation: ringPulse 1.2s infinite ease-in-out; }

    /* Dragging ghost appearance */
    .drag-item {
      cursor: grab;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .drag-item:active {
      cursor: grabbing;
      transform: scale(1.08) rotate(-2deg);
      box-shadow: 0 15px 25px rgba(0,0,0,0.35);
    }
  </style>
</head>

  <!-- ================= 4. JAVASCRIPT ENGINE ================= -->
  <script>
    /**
     * MONSTER DINER - 5 EXPANDED MOUSE MINI-GAMES
     * 100vw/100vh Zero-Scroll Architecture
     */

    // --- 1. WEB AUDIO SYNTHESIZER ---
    const AudioEngine = (() => {
      let ctx = null;
      let sfx = true;
      let speech = true;
      let voice = null;

      function getCtx() {
        if (!ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) ctx = new AudioContextClass();
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      function initVoices() {
        if ('speechSynthesis' in window) {
          const load = () => {
            const voices = window.speechSynthesis.getVoices();
            voice = voices.find(v => v.lang.startsWith('th')) || null;
          };
          load();
          if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = load;
          }
        }
      }

      return {
        init: () => initVoices(),
        toggleSFX: () => {
          sfx = !sfx;
          document.getElementById('sfxIconOn').classList.toggle('hidden', !sfx);
          document.getElementById('sfxIconOff').classList.toggle('hidden', sfx);
          if (sfx) AudioEngine.playPop();
        },
        toggleVoice: () => {
          speech = !speech;
          document.getElementById('voiceIconOn').classList.toggle('hidden', !speech);
          document.getElementById('voiceIconOff').classList.toggle('hidden', speech);
          if (speech) AudioEngine.speak("เปิดเสียงคุณครูแล้วจ้ะ");
        },
        speak: (text) => {
          if (!speech || !('speechSynthesis' in window)) return;
          try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'th-TH';
            if (voice) u.voice = voice;
            u.rate = 1.02;
            u.pitch = 1.2;
            window.speechSynthesis.speak(u);
          } catch(e) {}
        },
        playPop: () => {
          if (!sfx) return;
          try {
            const c = getCtx(); if (!c) return;
            const o = c.createOscillator();
            const g = c.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(650, c.currentTime);
            o.frequency.exponentialRampToValueAtTime(320, c.currentTime + 0.06);
            g.gain.setValueAtTime(0.2, c.currentTime);
            g.gain.linearRampToValueAtTime(0.01, c.currentTime + 0.06);
            o.connect(g); g.connect(c.destination);
            o.start(); o.stop(c.currentTime + 0.06);
          } catch(e) {}
        },
        playChop: () => {
          if (!sfx) return;
          try {
            const c = getCtx(); if (!c) return;
            const o = c.createOscillator();
            const g = c.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(480, c.currentTime);
            o.frequency.exponentialRampToValueAtTime(100, c.currentTime + 0.09);
            g.gain.setValueAtTime(0.35, c.currentTime);
            g.gain.linearRampToValueAtTime(0.01, c.currentTime + 0.09);
            o.connect(g); g.connect(c.destination);
            o.start(); o.stop(c.currentTime + 0.09);
          } catch(e) {}
        },
        playFlip: () => {
          if (!sfx) return;
          try {
            const c = getCtx(); if (!c) return;
            const o = c.createOscillator();
            const g = c.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(240, c.currentTime);
            o.frequency.exponentialRampToValueAtTime(700, c.currentTime + 0.12);
            g.gain.setValueAtTime(0.3, c.currentTime);
            g.gain.linearRampToValueAtTime(0.01, c.currentTime + 0.12);
            o.connect(g); g.connect(c.destination);
            o.start(); o.stop(c.currentTime + 0.12);
          } catch(e) {}
        },
        playCatch: () => {
          if (!sfx) return;
          try {
            const c = getCtx(); if (!c) return;
            [523.25, 783.99].forEach((freq, idx) => {
              const o = c.createOscillator();
              const g = c.createGain();
              o.type = 'sine';
              o.frequency.value = freq;
              g.gain.setValueAtTime(0.2, c.currentTime + idx * 0.05);
              g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + idx * 0.05 + 0.2);
              o.connect(g); g.connect(c.destination);
              o.start(c.currentTime + idx * 0.05);
              o.stop(c.currentTime + idx * 0.05 + 0.22);
            });
          } catch(e) {}
        },
        playSquirt: () => {
          if (!sfx) return;
          try {
            const c = getCtx(); if (!c) return;
            const o = c.createOscillator();
            const g = c.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(350, c.currentTime);
            o.frequency.linearRampToValueAtTime(850, c.currentTime + 0.06);
            o.frequency.exponentialRampToValueAtTime(180, c.currentTime + 0.14);
            g.gain.setValueAtTime(0.25, c.currentTime);
            g.gain.linearRampToValueAtTime(0.01, c.currentTime + 0.14);
            o.connect(g); g.connect(c.destination);
            o.start(); o.stop(c.currentTime + 0.14);
          } catch(e) {}
        },
        playFanfare: () => {
          if (!sfx) return;
          try {
            const c = getCtx(); if (!c) return;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            const now = c.currentTime;
            notes.forEach((f, i) => {
              const o = c.createOscillator();
              const g = c.createGain();
              o.type = 'triangle';
              o.frequency.value = f;
              g.gain.setValueAtTime(0.2, now + i * 0.08);
              g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
              o.connect(g); g.connect(c.destination);
              o.start(now + i * 0.08);
              o.stop(now + i * 0.08 + 0.4);
            });
          } catch(e) {}
        }
      };

            <div class="relative w-80 h-48 sm:w-[500px] sm:h-72 flex items-center justify-center">
              <svg viewBox="0 0 160 90" class="w-full h-full filter drop-shadow-2xl">
                <ellipse cx="80" cy="45" rx="74" ry="38" fill="#78350f" stroke="#451a03" stroke-width="5"/>
                <path d="M 32 30 L 65 62 M 65 22 L 98 62 M 98 22 L 130 58" stroke="#1c0a00" stroke-width="6" stroke-linecap="round"/>
              </svg>

              <!-- Dynamic Target 1 -->
              <button onclick="Game.handleSauceHit(this, 1)" class="absolute left-8 top-10 w-16 h-16 sm:w-20 sm:h-20 rounded-full border-4 border-dashed border-red-500 bg-red-500/25 hover:bg-red-500/40 target-pulse flex items-center justify-center transition-all">
                <span class="text-2xl sm:text-3xl">🎯</span>
              </button>

              <!-- Dynamic Target 2 -->
              <button onclick="Game.handleSauceHit(this, 2)" class="absolute left-32 sm:left-48 top-16 sm:top-24 w-16 h-16 sm:w-20 sm:h-20 rounded-full border-4 border-dashed border-yellow-500 bg-yellow-500/25 hover:bg-yellow-500/40 target-pulse flex items-center justify-center transition-all">
                <span class="text-2xl sm:text-3xl">🎯</span>
              </button>

              <!-- Dynamic Target 3 -->
              <button onclick="Game.handleSauceHit(this, 1)" class="absolute right-8 top-10 w-16 h-16 sm:w-20 sm:h-20 rounded-full border-4 border-dashed border-red-500 bg-red-500/25 hover:bg-red-500/40 target-pulse flex items-center justify-center transition-all">
                <span class="text-2xl sm:text-3xl">🎯</span>
              </button>

              <!-- Dynamic Target 4 -->
              <button onclick="Game.handleSauceHit(this, 2)" class="absolute right-24 sm:right-36 bottom-6 w-16 h-16 sm:w-20 sm:h-20 rounded-full border-4 border-dashed border-yellow-500 bg-yellow-500/25 hover:bg-yellow-500/40 target-pulse flex items-center justify-center transition-all">
                <span class="text-2xl sm:text-3xl">🎯</span>
              </button>
            </div>

          </div>
        `;
      }

      function handleSauceHit(btn, type) {
        AudioEngine.playSquirt();
        state.progress++;
        document.getElementById('stageProgressPill').textContent = `บีบซอสแล้ว: ${state.progress}/${state.goal} จุด`;

        btn.disabled = true;
        btn.classList.remove('target-pulse', 'border-dashed');
        btn.className = "absolute pointer-events-none splat-pop flex items-center justify-center";
        btn.innerHTML = `
          <svg viewBox="0 0 60 60" class="w-16 h-16 sm:w-20 sm:h-20 filter drop-shadow-md">
            <path d="M 30 6 C 38 10, 52 18, 46 32 C 54 42, 44 54, 30 50 C 16 54, 8 42, 14 30 C 6 18, 22 6, 30 6 Z" fill="${type === 2 ? '#eab308' : '#dc2626'}"/>
            <circle cx="24" cy="20" r="4" fill="white" opacity="0.6"/>
          </svg>
        `;

        if (state.progress >= state.goal) {
          AudioEngine.playFanfare();
          setTimeout(() => {
            showClearModal("บีบซอสฉ่ำน่ากิน!", "คุณคลิกซ้ายได้แม่นยำตรงเป้าหมายทุกจุด!");
          }, 400);
        } else {
          AudioEngine.speak("ปุ๊ด! เข้าเป้าหมายแล้ว คลิกจุดต่อไปเลยจ้ะ");
        }
      }

      // =========================================================================
      // มินิเกม 5: 🍔 หอคอยเบอร์เกอร์ยักษ์ (Drag & Drop) - ลากวางชิ้นโต ซ้อนกันเป็นหอคอย
      // =========================================================================
      function setupGame5_DragBurger() {
        state.goal = 4;
        state.progress = 0;
        updateGuide('drag', 'ลากและวาง (Drag & Drop)', 'คลิกซ้ายค้างไว้ แล้วลากมาปล่อยบนจาน', 'เกม 5: รวมร่าง (Drag & Drop)');
        document.getElementById('stageHintNotice').textContent = "คลิกซ้ายค้างที่วัตถุดิบทางซ้าย แล้วลากมาปล่อยลงบนจานทางขวานะจ๊ะ!";
        document.getElementById('stageProgressPill').textContent = `วางวัตถุดิบแล้ว: 0/${state.goal} ชั้น`;

        const stage = document.getElementById('giantStageArea');
        stage.innerHTML = `
          <!-- Giant Assembly Station (Wide 2 Columns) -->
          <div class="w-[95%] h-[92%] rounded-[40px] bg-slate-900/60 border-8 border-slate-600 flex items-center justify-between p-3 sm:p-6 gap-3 sm:gap-6 shadow-2xl relative overflow-hidden backdrop-blur-md">
            
            <!-- Left Shelf: Giant Ingredient Cards -->
            <div class="w-[42%] h-full bg-amber-100/90 rounded-3xl border-4 border-amber-300 p-3 sm:p-4 flex flex-col justify-around items-center shadow-lg">
              <span class="text-xs sm:text-sm font-black text-amber-950 font-kid">วัตถุดิบสดใหม่ (คลิกค้างแล้วลาก):</span>

              <div class="w-full flex flex-col gap-2 sm:gap-3 items-center">
                <!-- 1. Patty -->
                <div id="dragPatty" onpointerdown="Game.startDragItem(event, 'patty')" class="drag-item w-[90%] py-2.5 sm:py-3.5 bg-amber-900 hover:bg-amber-800 border-2 border-amber-950 rounded-2xl flex items-center justify-center gap-2 text-white font-black text-xs sm:text-base shadow">
                  <span class="text-xl sm:text-2xl">🥩</span> ชิ้นเนื้อย่าง
                </div>

                <!-- 2. Veggie -->
                <div id="dragVeggie" onpointerdown="Game.startDragItem(event, 'veggie')" class="drag-item w-[90%] py-2.5 sm:py-3.5 bg-emerald-600 hover:bg-emerald-500 border-2 border-emerald-800 rounded-2xl flex items-center justify-center gap-2 text-white font-black text-xs sm:text-base shadow">
                  <span class="text-xl sm:text-2xl">🥗</span> ผักสดกรอบ
                </div>

                <!-- 3. Cheese -->
                <div id="dragCheese" onpointerdown="Game.startDragItem(event, 'cheese')" class="drag-item w-[90%] py-2.5 sm:py-3.5 bg-yellow-400 hover:bg-yellow-300 border-2 border-yellow-600 rounded-2xl flex items-center justify-center gap-2 text-amber-950 font-black text-xs sm:text-base shadow">
                  <span class="text-xl sm:text-2xl">🧀</span> ชีสแผ่นเยิ้ม
                </div>

                <!-- 4. Top Bun -->
                <div id="dragTopBun" onpointerdown="Game.startDragItem(event, 'topbun')" class="drag-item w-[90%] py-2.5 sm:py-3.5 bg-amber-600 hover:bg-amber-500 border-2 border-amber-800 rounded-2xl flex items-center justify-center gap-2 text-white font-black text-xs sm:text-base shadow">
                  <span class="text-xl sm:text-2xl">🍞</span> ขนมปังฝาบน
                </div>
              </div>
            </div>

            <!-- Right: Giant Target Stacking Plate Area -->
            <div id="burgerDropZone" class="w-[58%] h-full bg-slate-950/80 rounded-3xl border-4 border-dashed border-amber-400 p-4 flex flex-col justify-end items-center shadow-inner relative">
              
              <div class="absolute top-4 px-4 py-1.5 bg-amber-400 text-amber-950 rounded-full font-black text-xs sm:text-sm font-kid shadow">
                🍽️ ลากมาปล่อยลงบนจานนี้เลย!
              </div>

              <!-- Tower Stack Container -->
              <div id="burgerStackContainer" class="flex flex-col-reverse items-center gap-1 mb-4 w-full">
                <!-- Base bottom bun -->
                <div class="w-48 sm:w-64 h-9 sm:h-12 bg-amber-600 rounded-b-3xl border-2 border-amber-800 shadow flex items-center justify-center text-xs font-black text-white font-kid">
                  🍞 ขนมปังล่าง
                </div>
              </div>

              <!-- Big Ceramic Plate Base -->
              <div class="w-64 sm:w-80 h-7 sm:h-9 bg-slate-200 rounded-full border-4 border-slate-400 shadow-2xl"></div>

            </div>

          </div>
        `;
      }

      function startDragItem(e, itemType) {
        e.preventDefault();
        AudioEngine.playPop();

        const map = { patty: 'dragPatty', veggie: 'dragVeggie', cheese: 'dragCheese', topbun: 'dragTopBun' };
        const sourceEl = document.getElementById(map[itemType]);
        if (!sourceEl) return;

        // Floating Ghost Element
        const ghost = sourceEl.cloneNode(true);
        ghost.id = 'floatingDragGhost';
        ghost.style.position = 'fixed';
        ghost.style.left = `${e.clientX - 60}px`;
        ghost.style.top = `${e.clientY - 30}px`;
        ghost.style.pointerEvents = 'none';
        ghost.style.zIndex = '9999';
        ghost.style.opacity = '0.9';
        ghost.style.transform = 'scale(1.1) rotate(3deg)';
        document.body.appendChild(ghost);

        const onMove = (ev) => {
          ghost.style.left = `${ev.clientX - 60}px`;
          ghost.style.top = `${ev.clientY - 30}px`;
        };

        const onUp = (ev) => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          ghost.remove();

          const dropZone = document.getElementById('burgerDropZone');
          if (dropZone) {
            const rect = dropZone.getBoundingClientRect();
            if (ev.clientX >= rect.left && ev.clientX <= rect.right &&
                ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
              handleDropIngredient(itemType, sourceEl);
            }
          }
        };

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      }

      function handleDropIngredient(itemType, sourceEl) {
        AudioEngine.playCatch();
        state.progress++;
        document.getElementById('stageProgressPill').textContent = `วางวัตถุดิบแล้ว: ${state.progress}/${state.goal} ชั้น`;

        sourceEl.classList.add('opacity-25', 'pointer-events-none');

        const stack = document.getElementById('burgerStackContainer');
        const layer = document.createElement('div');

        if (itemType === 'patty') {
          layer.className = "w-48 sm:w-64 h-8 sm:h-11 bg-amber-900 border-2 border-amber-950 rounded-2xl shadow flex items-center justify-center text-xs sm:text-sm font-black text-white font-kid splat-pop";
          layer.innerHTML = "🥩 เนื้อย่างหอมกรุ่น";
        } else if (itemType === 'veggie') {
          layer.className = "w-48 sm:w-64 h-7 sm:h-9 bg-emerald-600 border-2 border-emerald-800 rounded-xl shadow flex items-center justify-center text-xs sm:text-sm font-black text-white font-kid splat-pop";
          layer.innerHTML = "🥗 ผักสดกรอบ";
        } else if (itemType === 'cheese') {
          layer.className = "w-50 sm:w-68 h-6 sm:h-8 bg-yellow-400 border-2 border-yellow-600 rounded-lg shadow flex items-center justify-center text-xs sm:text-sm font-black text-amber-950 font-kid splat-pop";
          layer.innerHTML = "🧀 แผ่นชีสเยิ้ม";
        } else if (itemType === 'topbun') {
          layer.className = "w-48 sm:w-64 h-11 sm:h-14 bg-amber-500 border-2 border-amber-700 rounded-t-3xl shadow-lg flex items-center justify-center text-xs sm:text-sm font-black text-white font-kid splat-pop";
          layer.innerHTML = "🍞 ขนมปังฝาบน";
        }

        stack.appendChild(layer);

        if (state.progress >= state.goal) {
          AudioEngine.playFanfare();
          setTimeout(() => {
            showClearModal("เบอร์เกอร์ยักษ์เสร็จแล้ว!", "คุณเชี่ยวชาญการลากและวาง (Drag & Drop) แล้ว!");
          }, 400);
        } else {
          AudioEngine.speak("วางสวยมาก! ลากชิ้นต่อไปมาซ้อนเลยจ้ะ");
        }
      }

      // --- COMMON HELPERS ---
      function showClearModal(title, desc) {
        state.stars += 3;
        saveStorage();
        document.getElementById('starDisplay').textContent = state.stars;

        document.getElementById('modalClearTitle').textContent = title;
        document.getElementById('modalClearDesc').textContent = desc;
        openModal('gameClearModal');
        AudioEngine.speak(title + " " + desc);
      }

      function advanceToNextGame() {
        closeModal('gameClearModal');
        if (state.currentGame < 5) {
          switchMiniGame(state.currentGame + 1);
        } else {
          switchMiniGame(1);
        }
      }

      function restartMiniGame() {
        closeModal('gameClearModal');
        switchMiniGame(state.currentGame);
      }

      function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
      function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      }

      return {
        init,
        switchMiniGame,
        restartMiniGame,
        advanceToNextGame,
        speakCurrentTask,
        handleSauceHit,
        startDragItem,
        closeModal,
        toggleFullscreen
      };
    })();

    // Initialize on window load
    window.addEventListener('load', () => Game.init());
  </script>
</body>
</html>
